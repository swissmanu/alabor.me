<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8efe3">
  <title>Happy Birthday Karin!</title>

  <!-- Webfonts only; no JavaScript or external dependencies. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      /* Suggested scheme: Gurten-grün + warmes Festival-Creme + sanftes Rosé.
         Easy tweaks: change these five values only. */
      --bg: #f8efe3;
      --card: #fffaf2;
      --ink: #163427;
      --muted: #5f6f66;
      --accent: #e96f5a;
      --accent-dark: #1f4d3a;
      --shadow: 0 24px 60px rgba(22, 52, 39, 0.18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(circle at top left, rgba(233, 111, 90, 0.26), transparent 32%),
        radial-gradient(circle at bottom right, rgba(31, 77, 58, 0.22), transparent 34%),
        var(--bg);
      background-attachment: fixed;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding:
        max(20px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(22px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
      color: var(--ink);
      font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: transparent;
    }

    main {
      width: min(calc(100vw - 36px), 390px);
    }

    .card {
      position: relative;
      overflow: hidden;
      min-height: calc(100dvh - 40px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 28px;
      padding: 28px 24px 24px;
      border: 1px solid rgba(22, 52, 39, 0.08);
      border-radius: 34px;
      background: linear-gradient(180deg, rgba(255, 250, 242, 0.96), rgba(255, 250, 242, 0.88));
      box-shadow: var(--shadow);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: -80px -90px auto auto;
      width: 190px;
      height: 190px;
      border-radius: 999px;
      background: rgba(233, 111, 90, 0.18);
    }



    h1 {
      max-width: 9ch;
      margin: 0;
      font-family: "Fraunces", Georgia, serif;
      font-size: clamp(3rem, 16vw, 4.35rem);
      line-height: 0.9;
      letter-spacing: -0.055em;
    }

    .heart {
      display: inline-block;
      color: var(--accent);
      transform: translateY(-0.04em) rotate(-8deg);
    }

    .message {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: clamp(1.05rem, 4.5vw, 1.25rem);
      line-height: 1.45;
    }

    .gift {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .gift li {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 15px;
      border-radius: 22px;
      color: var(--ink);
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.25;
      background: rgba(31, 77, 58, 0.08);
    }

    .icon {
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: var(--card);
      font-size: 1.05rem;
      background: var(--accent);
    }

    .footer {
      padding-top: 4px;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.4;
      text-align: center;
    }

    .footer strong {
      color: var(--ink);
    }

    @media (max-height: 700px) {
      .card {
        min-height: calc(100dvh - 40px);
        gap: 22px;
        padding-top: 24px;
      }

      h1 {
        font-size: clamp(2.7rem, 14vw, 3.7rem);
      }

      .message {
        margin-top: 18px;
      }
    }
  </style>
</head>
<body>
  <main aria-label="Geburtstagsgeschenk für Karin">
    <section class="card">
      <div>
        <h1>Happy Birthday Karin<span class="heart">!</span></h1>
        <p class="message">Du bekommst ein Festival-Wochenende am Gurten Festival 2026.</p>
      </div>

      <ul class="gift" aria-label="Geschenkdetails">
        <li><span class="icon" aria-hidden="true">♪</span><span>Weekend am Gurten Festival 2026<br><small>17. – 19.07.2026</small></span></li>
        <li><span class="icon" aria-hidden="true">⛺︎</span><span>2 Nächte in einem Airbnb</span></li>
        <li><span class="icon" aria-hidden="true">♥</span><span>Zeit zusammen, Musik und Bern von oben</span></li>
        <li><span class="icon" aria-hidden="true">✓</span><span>Kinder sind versorgt</span></li>
      </ul>

      <p class="footer"><strong>Pack die Vorfreude ein.</strong><br>Alles Weitere folgt.</p>
    </section>
  </main>
</body>
</html>
